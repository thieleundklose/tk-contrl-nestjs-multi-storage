name: Publish Package

on:
  push:
    tags:
      - 'v*' # Nur bei neuen Tags wie v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          #registry-url: 'https://npm.pkg.github.com' # für GitHub Packages
          registry-url: 'https://registry.npmjs.org/' # für npmjs.com

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to Registry
        run: npm run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
